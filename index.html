<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Print Studio</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* --- Premium Theme Colors --- */
        :root {
            --bg-main: #09090b;
            --bg-dock: #18181b;
            --btn-bg: #27272a;
            --btn-active: #3f3f46;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- App Header --- */
        .header {
            padding: 20px; text-align: center; font-size: 24px; font-weight: 800;
            background: linear-gradient(90deg, #60a5fa, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            flex-shrink: 0;
        }

        /* --- Stage Area (Preview) --- */
        .stage {
            flex: 1; width: 100%; display: flex; align-items: center;
            overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
            padding: 0 30px; gap: 20px;
        }
        .stage::-webkit-scrollbar { display: none; }

        .empty-state {
            width: 100%; text-align: center; color: var(--text-muted); font-size: 16px; font-weight: bold;
        }

        .page-card {
            width: 65vw; max-width: 260px; aspect-ratio: 1 / 1.414; 
            background: #111; border-radius: 12px; border: 1px solid #333;
            flex-shrink: 0; scroll-snap-align: center; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden;
        }
        .page-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .delete-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(239, 68, 68, 0.9);
            color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- Action Dock --- */
        .dock {
            background: var(--bg-dock); padding: 25px 20px calc(25px + env(safe-area-inset-bottom));
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            border-top: 1px solid #333; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); flex-shrink: 0;
        }

        .grid-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

        .action-btn {
            aspect-ratio: 1 / 0.95; background: var(--btn-bg); border: 1px solid #333;
            border-radius: 18px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; color: var(--text-main); font-size: 13px;
            font-weight: 600; cursor: pointer; transition: 0.1s ease-in-out; position: relative;
        }
        .action-btn i { font-size: 26px; }
        .action-btn:active { transform: scale(0.92); background: var(--btn-active); }
        
        .btn-link i { color: #0ea5e9; }
        .btn-gallery i { color: #3b82f6; }
        .btn-bw i { color: #f8fafc; }
        .btn-img i { color: #a855f7; }
        .btn-pdf i { color: #ef4444; }
        .btn-print i { color: #10b981; }
        
        .action-btn.bw-active { background: #f8fafc; color: #000; }
        .action-btn.bw-active i { color: #000; }

        /* --- URL Modal --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s ease; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-box {
            background: var(--bg-dock); width: 100%; max-width: 350px;
            border-radius: 24px; border: 1px solid #333; padding: 25px;
            display: flex; flex-direction: column; gap: 15px; text-align: center;
            transform: translateY(20px); transition: 0.3s ease;
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }

        .modal-input {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #444;
            background: #000; color: #fff; outline: none; font-size: 15px; text-align: center;
        }
        
        .modal-btn {
            padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold;
            background: var(--accent); color: #fff; cursor: pointer; width: 100%;
        }
        .modal-btn.close { background: #333; margin-top: -5px; }

        /* --- Print Zone Settings --- */
        #printZone { display: none; }
        @media print {
            body { background: white !important; margin: 0 !important; padding: 0 !important; display: block !important; }
            .header, .stage, .dock, .modal-overlay { display: none !important; }
            #printZone { display: block !important; width: 100%; }
            #printZone img { width: 210mm; height: 297mm; object-fit: cover; page-break-after: always; display: block; margin: 0; padding: 0; border: none; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="header">Print Studio</div>

    <div class="stage" id="stageArea">
        <div class="empty-state">No pages yet.<br><span style="font-size:13px; opacity:0.5; font-weight:normal;">Add links or photos from the menu below.</span></div>
    </div>

    <div class="dock">
        <div class="grid-6">
            <div class="action-btn btn-link" onclick="openLinkModal()">
                <i class="fas fa-link"></i><span>URL Link</span>
            </div>
            
            <label class="action-btn btn-gallery">
                <i class="fas fa-images"></i><span>Gallery</span>
                <input type="file" accept="image/*" multiple onchange="handleGallery(event)" style="display:none;">
            </label>
            
            <div class="action-btn btn-bw" id="bwBtn" onclick="toggleBW()">
                <i class="fas fa-adjust"></i><span>B&W</span>
            </div>
            
            <div class="action-btn btn-img" onclick="downloadImageSync()" id="btnImg">
                <i class="fas fa-image"></i><span>Image</span>
            </div>
            
            <div class="action-btn btn-pdf" onclick="downloadPdfSync()" id="btnPdf">
                <i class="fas fa-file-pdf"></i><span>PDF</span>
            </div>
            
            <div class="action-btn btn-print" onclick="executePrintSync()" id="btnPrint">
                <i class="fas fa-print"></i><span>Print</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="linkModal">
        <div class="modal-box">
            <h3 style="color:#fff;">Add Image URL</h3>
            <input type="text" id="urlInput" class="modal-input" placeholder="https://...">
            <button class="modal-btn" onclick="submitUrl()">Add Page</button>
            <button class="modal-btn close" onclick="closeLinkModal()">Cancel</button>
        </div>
    </div>

    <div id="printZone"></div>

    <script>
        // Init Telegram WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        // Trigger Haptic Feedback
        function triggerHaptic(type = 'light') {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
        }

        let rawImages = [];
        let processedImages = [];
        let isBw = false;

        const stageArea = document.getElementById('stageArea');
        const bwBtn = document.getElementById('bwBtn');
        const linkModal = document.getElementById('linkModal');
        const urlInput = document.getElementById('urlInput');
        const printZone = document.getElementById('printZone');

        // Render UI
        function renderStageUI() {
            stageArea.innerHTML = '';
            if(processedImages.length === 0) {
                stageArea.innerHTML = '<div class="empty-state">No pages yet.<br><span style="font-size:13px; opacity:0.5; font-weight:normal;">Add links or photos from the menu below.</span></div>';
                return;
            }
            processedImages.forEach((b64, idx) => {
                const card = document.createElement('div');
                card.className = 'page-card';
                card.innerHTML = `<img src="${b64}"><button class="delete-btn" onclick="removePage(${idx})"><i class="fas fa-times"></i></button>`;
                stageArea.appendChild(card);
            });
        }

        // Engine: Pre-process images instantly on add to ensure sync buttons work
        async function rebuildEngine() {
            stageArea.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Processing...</div>';
            processedImages = [];
            for (let src of rawImages) {
                const b64 = await createA4Canvas(src);
                if(b64) processedImages.push(b64);
            }
            renderStageUI();
        }

        function createA4Canvas(src) {
            return new Promise((resolve) => {
                const img = new Image(); 
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1404; canvas.height = 1986; 
                    const ctx = canvas.getContext('2d');
                    
                    if (isBw) ctx.filter = 'grayscale(100%) contrast(150%)';
                    ctx.fillStyle = '#000'; 
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const ratio = Math.max(canvas.width / img.width, canvas.height / img.height); 
                    const cx = (canvas.width - img.width * ratio) / 2;
                    const cy = (canvas.height - img.height * ratio) / 2;

                    ctx.drawImage(img, 0, 0, img.width, img.height, cx, cy, img.width*ratio, img.height*ratio);
                    resolve(canvas.toDataURL('image/jpeg', 0.95)); 
                };
                img.onerror = () => { resolve(null); };
                img.src = src;
            });
        }

        window.removePage = async function(idx) { 
            rawImages.splice(idx, 1); 
            triggerHaptic('medium');
            await rebuildEngine();
        };

        window.openLinkModal = () => { urlInput.value = ''; linkModal.classList.add('active'); triggerHaptic(); };
        window.closeLinkModal = () => { linkModal.classList.remove('active'); };
        
        window.submitUrl = async () => { 
            if(urlInput.value) { 
                rawImages.push(urlInput.value); 
                closeLinkModal();
                triggerHaptic('success');
                await rebuildEngine();
            } 
        };

        window.handleGallery = async function(e) {
            const files = e.target.files;
            if(!files.length) return;
            
            triggerHaptic('light');
            stageArea.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Reading files...</div>';
            
            for(let f of files) {
                const b64 = await new Promise(res => {
                    const reader = new FileReader();
                    reader.onload = ev => res(ev.target.result);
                    reader.readAsDataURL(f);
                });
                rawImages.push(b64);
            }
            e.target.value = '';
            await rebuildEngine();
        };

        window.toggleBW = async function() {
            if(rawImages.length === 0) return;
            isBw = !isBw;
            bwBtn.classList.toggle('bw-active', isBw);
            triggerHaptic('medium');
            await rebuildEngine();
        };

        // ==========================================
        // 📥 1. Synchronous Image Download
        // ==========================================
        window.downloadImageSync = function() {
            if(processedImages.length === 0) return alert("Please add an image first.");
            triggerHaptic('heavy');
            
            // Sync execution prevents browser blocking
            processedImages.forEach((b64, i) => {
                const link = document.createElement('a');
                link.href = b64;
                link.download = `Page_${i+1}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        };

        // ==========================================
        // 📄 2. Synchronous PDF Download
        // ==========================================
        window.downloadPdfSync = function() {
            if(processedImages.length === 0) return alert("Please add an image first.");
            triggerHaptic('heavy');
            
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const w = pdf.internal.pageSize.getWidth(); 
                const h = pdf.internal.pageSize.getHeight();

                processedImages.forEach((b64, i) => {
                    if(i > 0) pdf.addPage();
                    pdf.addImage(b64, 'JPEG', 0, 0, w, h); 
                });
                
                pdf.save("Document.pdf"); 
                
            } catch(e) { 
                alert("Error generating PDF."); 
            }
        };

        // ==========================================
        // 🖨️ 3. Synchronous Direct Print
        // ==========================================
        window.executePrintSync = function() {
            if(processedImages.length === 0) return alert("Please add an image first.");
            triggerHaptic('heavy');
            
            // Synchronous DOM update ensures window.print is trusted
            printZone.innerHTML = processedImages.map(b64 => `<img src="${b64}">`).join('');
            
            window.print();
            
            // Clean up silently
            setTimeout(() => { printZone.innerHTML = ''; }, 1000);
        };
    </script>
</body>
</html>
