<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Print Studio</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#09090b;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.stage{
    flex:1;
    display:flex;
    gap:15px;
    overflow-x:auto;
    padding:20px;
    align-items:center;
}

.stage::-webkit-scrollbar{
    display:none;
}

.empty{
    width:100%;
    text-align:center;
    color:#aaa;
}

.card{
    width:260px;
    aspect-ratio:210/297;
    background:#111;
    border-radius:12px;
    overflow:hidden;
    flex-shrink:0;
    position:relative;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.bw img{
    filter:grayscale(1) contrast(1.5);
}

.delete{
    position:absolute;
    top:8px;
    right:8px;
    border:0;
    border-radius:50%;
    width:30px;
    height:30px;
    background:#e11;
    color:white;
}


.dock{
    background:#18181b;
    padding:15px;
    border-radius:25px 25px 0 0;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

button,
label{
    background:#27272a;
    color:white;
    border:1px solid #444;
    border-radius:15px;
    height:75px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
}

button:active,
label:active{
    transform:scale(.94);
}


.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.box{
    background:#18181b;
    padding:20px;
    border-radius:20px;
    width:100%;
    max-width:350px;
}

input{
    width:100%;
    padding:12px;
    margin:15px 0;
    background:#000;
    color:white;
    border:1px solid #555;
    border-radius:10px;
}

.box button{
    height:50px;
    width:100%;
    margin-top:8px;
}


#printZone{
    display:none;
}

@media print{

body{
    display:block;
}

.header,
.stage,
.dock,
.modal{
    display:none!important;
}

#printZone{
    display:block;
}

#printZone img{
    width:210mm;
    height:297mm;
    object-fit:cover;
    page-break-after:always;
}

@page{
    size:A4;
    margin:0;
}

}

</style>
</head>




<body>

<div class="header">
    Print Studio
</div>


<div class="stage" id="stage">
    <div class="empty" id="empty">
        لا توجد صور بعد
    </div>
</div>


<div class="dock">

<div class="buttons">

<button onclick="openModal()">
🔗
<span>URL</span>
</button>


<label>
🖼️
<span>Gallery</span>

<input id="gallery"
type="file"
accept="image/*"
multiple
hidden
onchange="galleryAdd(event)">

</label>


<button onclick="toggleBW()">
⚫
<span>B&W</span>
</button>


<button onclick="downloadImages()">
📷
<span>Image</span>
</button>


<button onclick="downloadPDF()">
📄
<span>PDF</span>
</button>


<button onclick="printPages()">
🖨️
<span>Print</span>
</button>


</div>

</div>



<div class="modal" id="modal">

<div class="box">

<h3>
إضافة رابط صورة
</h3>


<input id="url"
placeholder="https://image.jpg">


<button onclick="addURL()">
إضافة
</button>


<button onclick="closeModal()">
إلغاء
</button>


</div>

</div>


<div id="printZone"></div>





    <script>

const tg = window.Telegram?.WebApp;
if(tg){
    tg.ready();
    tg.expand();
}


let pages=[];
let bw=false;


const stage=document.getElementById("stage");
const empty=document.getElementById("empty");



function render(){

    stage.innerHTML="";

    if(pages.length===0){
        stage.appendChild(empty);
        return;
    }


    pages.forEach((src,i)=>{

        let card=document.createElement("div");

        card.className="card "+(bw?"bw":"");


        card.innerHTML=`

        <img src="${src}">

        <button class="delete"
        onclick="removePage(${i})">
        ×
        </button>

        `;


        stage.appendChild(card);

    });

}



function removePage(i){

    pages.splice(i,1);
    render();

}



function addImage(src){

    let img=new Image();

    img.onload=()=>{

        pages.push(src);
        render();

    };


    img.onerror=()=>{

        alert("تعذر تحميل الصورة");

    };


    img.src=src;

}





function galleryAdd(e){

    [...e.target.files].forEach(file=>{

        let r=new FileReader();

        r.onload=x=>addImage(x.target.result);

        r.readAsDataURL(file);

    });


    e.target.value="";

}




function openModal(){

    document.getElementById("modal")
    .classList.add("show");

}


function closeModal(){

    document.getElementById("modal")
    .classList.remove("show");

}



function addURL(){

    let url=document.getElementById("url").value.trim();

    if(url){

        addImage(url);
        closeModal();

    }

}




function toggleBW(){

    bw=!bw;
    render();

}




function process(src){

return new Promise(resolve=>{


let img=new Image();

img.onload=()=>{


let c=document.createElement("canvas");

c.width=1404;
c.height=1986;


let ctx=c.getContext("2d");


if(bw)
ctx.filter="grayscale(1) contrast(1.5)";


let scale=Math.max(
c.width/img.width,
c.height/img.height
);


let x=(c.width-img.width*scale)/2;
let y=(c.height-img.height*scale)/2;


ctx.drawImage(
img,
x,
y,
img.width*scale,
img.height*scale
);



resolve(c.toDataURL("image/jpeg",0.95));


};


img.src=src;


});

}




async function downloadImages(){

if(!pages.length)
return alert("أضف صوراً أولاً");


for(let i=0;i<pages.length;i++){

let data=await process(pages[i]);


let a=document.createElement("a");

a.href=data;

a.download="Page_"+(i+1)+".jpg";

a.click();


}

}




async function downloadPDF(){

if(!pages.length)
return alert("أضف صوراً أولاً");


const {jsPDF}=window.jspdf;


let pdf=new jsPDF(
"p",
"mm",
"A4"
);


for(let i=0;i<pages.length;i++){


if(i)
pdf.addPage();


let img=await process(pages[i]);


pdf.addImage(
img,
"JPEG",
0,
0,
210,
297
);


}


pdf.save("Document.pdf");


}




async function printPages(){

if(!pages.length)
return alert("أضف صوراً أولاً");


let zone=document.getElementById("printZone");

zone.innerHTML="";


for(let p of pages){

let img=document.createElement("img");

img.src=await process(p);

zone.appendChild(img);

}



setTimeout(()=>{

window.print();

zone.innerHTML="";

},500);


}



</script>

</body>
</html>
