<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Sticker Sheet Generator</title>
    
    <!-- Libraries for Image and PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .section {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #0056b3;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="file"] {
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary { background-color: #0d6efd; }
        .btn-primary:hover { background-color: #0b5ed7; }
        
        .btn-success { background-color: #198754; }
        .btn-success:hover { background-color: #157347; }
        
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #bb2d3b; }
        
        .btn-warning { background-color: #ffc107; color: #000; }
        .btn-warning:hover { background-color: #ffca2c; }

        /* A4 Paper Settings */
        .paper-container {
            position: relative;
        }

        .a4-paper {
            width: 210mm;
            height: 297mm;
            background-color: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            /* Default padding: Top 5mm, Right 12mm (1.2cm), Bottom 5mm, Left 5mm */
            padding: 5mm 12mm 5mm 5mm; 
            box-sizing: border-box;
            
            display: grid;
            /* Grid will be updated via JS */
            grid-template-columns: repeat(6, 1fr);
            gap: 2mm;
            overflow: hidden;
        }

        .img-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            /* Default fit */
            object-fit: contain; 
        }

        @media print {
            body { background-color: white; padding: 0; }
            .control-panel { display: none; }
            .a4-paper { box-shadow: none; margin: 0; page-break-after: always; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="control-panel">
        <!-- Image Source Section -->
        <div class="section">
            <h3>1. Image Source</h3>
            <label>Upload from Device:</label>
            <input type="file" id="fileInput" accept="image/*">
            
            <label style="margin-top: 10px;">OR Paste Image URL:</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="urlInput" placeholder="https://example.com/image.jpg">
                <button class="btn-primary" onclick="loadImageFromURL()">Load</button>
            </div>
        </div>

        <!-- Grid Settings Section -->
        <div class="section">
            <h3>2. Layout Settings</h3>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Total Copies:</label>
                    <input type="number" id="copiesCount" value="54" min="1" onchange="generateGrid()">
                </div>
                <div style="flex: 1;">
                    <label>Columns:</label>
                    <input type="number" id="columnsCount" value="6" min="1" onchange="generateGrid()">
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <div style="flex: 1;">
                    <label>Gap (mm):</label>
                    <input type="number" id="gapSize" value="2" min="0" onchange="generateGrid()">
                </div>
                <div style="flex: 1;">
                    <label>Image Fit:</label>
                    <select id="imageFit" onchange="generateGrid()">
                        <option value="contain">Contain (No Crop)</option>
                        <option value="cover">Cover (Fill Space)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Actions Section -->
        <div class="section">
            <h3>3. Export Options</h3>
            <div class="btn-group">
                <button class="btn-primary" onclick="window.print()">🖨️ Print</button>
            </div>
            <div class="btn-group">
                <button class="btn-danger" onclick="saveAsPDF()">📄 Save as PDF</button>
                <button class="btn-success" onclick="downloadImage()">⬇️ High-Res PNG</button>
            </div>
        </div>
    </div>

    <!-- A4 Paper -->
    <div class="paper-container">
        <div class="a4-paper" id="paper">
            <!-- Images will be injected here -->
        </div>
    </div>

    <script>
        // Default Image (Transparent pixel placeholder to keep layout empty initially)
        let currentImgSrc = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; 

        // Handle File Upload
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImgSrc = event.target.result;
                    generateGrid();
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle URL Input
        function loadImageFromURL() {
            const url = document.getElementById('urlInput').value;
            if (url) {
                currentImgSrc = url;
                generateGrid();
            } else {
                alert("Please enter a valid image URL.");
            }
        }

        // Generate the Grid
        function generateGrid() {
            const paper = document.getElementById('paper');
            const copiesCount = parseInt(document.getElementById('copiesCount').value) || 54;
            const columnsCount = parseInt(document.getElementById('columnsCount').value) || 6;
            const gapSize = parseInt(document.getElementById('gapSize').value) || 0;
            const imageFit = document.getElementById('imageFit').value;

            // Update CSS based on settings
            paper.style.gridTemplateColumns = `repeat(${columnsCount}, 1fr)`;
            paper.style.gap = `${gapSize}mm`;
            paper.innerHTML = ''; // Clear previous images

            // Create images
            for (let i = 0; i < copiesCount; i++) {
                const div = document.createElement('div');
                div.className = 'img-box';
                
                const img = document.createElement('img');
                img.crossOrigin = "Anonymous"; // Crucial for external URLs
                img.src = currentImgSrc;
                img.style.objectFit = imageFit;
                
                div.appendChild(img);
                paper.appendChild(div);
            }
        }

        // Generate empty grid on load
        window.onload = generateGrid;

        // ---------------- EXPORT FUNCTIONS ----------------

        // 1. Save as PDF (Using html2pdf.js)
        function saveAsPDF() {
            const paper = document.getElementById('paper');
            
            // Configuration for high quality PDF
            const opt = {
                margin:       0,
                filename:     'A4_Stickers.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 3, useCORS: true, allowTaint: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Remove box shadow temporarily
            const originalShadow = paper.style.boxShadow;
            paper.style.boxShadow = 'none';

            html2pdf().set(opt).from(paper).save().then(() => {
                paper.style.boxShadow = originalShadow;
            }).catch(err => {
                console.error("PDF Error: ", err);
                paper.style.boxShadow = originalShadow;
            });
        }

        // 2. Download as High-Res PNG (Using html2canvas)
        function downloadImage() {
            const paper = document.getElementById('paper');
            
            // Remove box shadow temporarily
            const originalShadow = paper.style.boxShadow;
            paper.style.boxShadow = 'none';

            html2canvas(paper, { scale: 3, useCORS: true, allowTaint: false }).then(canvas => {
                paper.style.boxShadow = originalShadow;
                
                const link = document.createElement('a');
                link.download = 'A4_Stickers_Sheet.png';
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            }).catch(err => {
                console.error("Image Error: ", err);
                alert("Download failed. If using a URL from a restricted site, try uploading the image from your device instead due to browser security (CORS).");
                paper.style.boxShadow = originalShadow;
            });
        }
    </script>
</body>
</html>
